name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint

  build:
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Building z3 takes a long time, so the build is reused until what it's made from changes.
      - id: cache
        uses: actions/cache@v4
        with:
          path: |
            javascript/z3.mjs
            javascript/z3.wasm
            javascript/z3.sha256
          key: z3-${{ hashFiles('versions.env', 'scripts/build.sh', 'src/**') }}
      - if: steps.cache.outputs.cache-hit != 'true'
        run: ./scripts/install-toolchain.sh
      - if: steps.cache.outputs.cache-hit != 'true'
        run: |
          source ~/emsdk/emsdk_env.sh
          ./scripts/build.sh
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm test --prefix javascript
      - uses: actions/upload-artifact@v4
        with:
          name: z3
          path: |
            javascript/z3.mjs
            javascript/z3.wasm
            javascript/z3.sha256

  # Pushes to main publish a release when javascript/package.json has a new version.
  release:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: z3
          path: javascript
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(jq -r .version javascript/package.json)
          if gh release view "v$version" >/dev/null 2>&1; then
            echo "v$version is already released."
            exit 0
          fi
          tarball=$(cd javascript && npm pack --silent)
          gh release create "v$version" javascript/z3.wasm javascript/z3.sha256 "javascript/$tarball" \
            --target "$GITHUB_SHA" --generate-notes
